[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
upload_speed = 115200
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
; 4MB ESP-12E modules most commonly need dout. If upload succeeds but the
; board won't boot afterward, try switching this to qio.
board_build.flash_mode = dout
